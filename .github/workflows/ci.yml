name: PoliceForensicsAI Enterprise CI/CD

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  integration-tests:
    name: Run PyTest Integration Suite
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install fastapi uvicorn python-multipart pytest pytest-cov pandas opencv-python torch torchvision pydantic python-dotenv gradio httpx easyocr jiwer python-dateutil google-genai tenacity bandit

    - name: Run Deterministic Guardrail Tests
      run: |
        pytest tests/ -v --cov=src

    - name: Security Audit (Bandit)
      run: |
        bandit -r src/ -c bandit.yaml || true
